[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breach-shift"
version = "0.1.0"
description = "An offline Panda3D zombie campaign with two switchable realities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["panda3d==1.10.16"]

[project.scripts]
breach-shift = "breach_shift.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["breach_shift*"]
namespaces = false

[tool.setuptools.package-data]
breach_shift = ["data/levels/*.json", "data/audio/*.wav"]
