[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breach-shift"
version = "0.1.0"
description = "An offline Panda3D zombie campaign with two switchable realities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["panda3d==1.10.16", "panda3d-gltf==1.3.0", "panda3d-simplepbr==0.13.1"]

[project.scripts]
breach-shift = "breach_shift.app:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["breach_shift*"]
namespaces = false

[tool.setuptools.package-data]
breach_shift = ["data/levels/*.json", "data/audio/*.wav",
                "data/models/characters/*.bam", "data/models/characters/*.bam.pz",
                "data/models/weapons/*.bam", "data/models/weapons/*.bam.pz",
                "data/models/weapons/*.glb", "data/models/characters/*.glb",
                "data/models/environments/*.glb", "data/models/environments/*.json",
                "data/lighting/*.env", "data/credits/*.md"]
