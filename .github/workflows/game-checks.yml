name: Game checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: game-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      ALSOFT_DRIVERS: 'null'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install software rendering and game dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libopenal1
          python -m pip install -r requirements.txt
      - name: Compile and run the game tests
        run: |
          python tools/release/check_sources.py
          python -m compileall -q breach_shift tests tools
          xvfb-run -a -s '-screen 0 1600x900x24' python -m unittest discover -s tests -v
      - name: Build and inspect the installable game
        run: |
          python -m pip wheel . --no-deps --wheel-dir .cache/wheels
          python tools/release/check_wheel.py .cache/wheels/*.whl
